name: BOM dependency equivalence

on:
  pull_request:
    branches: [main]
    paths:
      - 'build.gradle.kts'
      - 'scripts/*bom*'
      - 'scripts/dependency-snapshot.init.gradle'
      - '.github/workflows/bom-verification.yml'
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline commit before the BOM cleanup'
        required: true
        default: '9d51f8c6b2a9ac6adb19e91da86d7affd7088491'

permissions:
  contents: read

jobs:
  compare:
    # This is a declaration-only migration check, not a ban on later version updates.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'nisyumidon/nis-42-bom整理前後の依存一致を検証してprを作成する'
    runs-on: ubuntu-latest
    env:
      GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-user-home
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Compare all four resolved classpaths
        env:
          BASELINE: ${{ github.event.pull_request.base.sha || inputs.baseline }}
        run: python scripts/verify-bom-dependencies.py "$BASELINE"
      - name: Preserve resolution evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bom-dependency-evidence
          path: build/bom-verification/
          if-no-files-found: error
