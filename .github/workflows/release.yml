name: Release

on:
  push:
    branches:
      - 'release/v*'
      - 'release/v*-*' # for pre-releases like release/v1.0.0-alpha
  # Validate changes to this workflow without publishing release images.
  pull_request:
    branches: [ "main" ]
    paths:
      - '.github/workflows/release.yml'

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK 17
      uses: actions/setup-java@v6
      with:
        java-version: '17'
        distribution: 'temurin'

    # Configure Gradle for optimal use in GitHub Actions, including caching of downloaded dependencies.
    # See: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5

    - name: Build with Gradle Wrapper
      run: ./gradlew build

    - name: Build dockerfile
      run: ./gradlew dockerCreateDockerfile

    - name: Archive production artifacts
      uses: actions/upload-artifact@v7
      with:
        name: build
        if-no-files-found: error
        path: |
          build/libs
          build/distributions
          build/docker

    - name: Get version from repository metadata
      id: version
      env:
        PR_NUMBER: ${{ github.event.number }}
      run: |
        if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
          echo "version=v0.0.0-pr-${PR_NUMBER}" >> "$GITHUB_OUTPUT"
        else
          echo "version=${GITHUB_REF_NAME#release/}" >> "$GITHUB_OUTPUT"
        fi

    outputs:
      version: ${{ steps.version.outputs.version }}

  registry:

    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: build
          path: build

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        id: buildx
        uses: docker/setup-buildx-action@v4
        with:
          platforms: linux/amd64,linux/arm64

      # GitHub Packages
      - name: Log in to the Container registry
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: "ghcr.io/westelh/oci-billing-exporter:${{ needs.build.outputs.version }}"
          context: build/docker
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ steps.buildx.outputs.platforms }}
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}

      # Docker Hub
      - name: Log in to Docker Hub
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          tags: "westelh/oci-billing-exporter:${{ needs.build.outputs.version }}"
          context: build/docker
          builder: ${{ steps.buildx.outputs.name }}
          platforms: ${{ steps.buildx.outputs.platforms }}
          # For pull requests, export results to the build cache.
          # Otherwise, push to a registry.
          outputs: ${{ github.event_name == 'pull_request' && 'type=cacheonly' || 'type=registry' }}
