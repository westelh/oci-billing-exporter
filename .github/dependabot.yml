# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    schedule:
      interval: "daily"
    ignore:
      # Victools 5 requires Jackson 3; retain Jackson 2 while the OCI SDK uses it.
      # Continue receiving Victools 4.x minor and patch updates.
      - dependency-name: "com.github.victools:jsonschema-generator-bom"
        update-types:
          - "version-update:semver-major"
      # Kotlin 2.4.21 fully supports Gradle only through 9.7.0. Hold the wrapper
      # on 9.8.x (patch updates only) until a Kotlin release covers newer Gradle;
      # see docs/gradle9-migration.md.
      - dependency-name: "gradle-wrapper"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"
