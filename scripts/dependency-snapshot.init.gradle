import groovy.json.JsonOutput
import org.gradle.api.artifacts.component.ModuleComponentIdentifier

// Applied to both revisions; no build-file changes are needed on the baseline.
gradle.projectsEvaluated {
    rootProject.tasks.register('dependencySnapshot') {
        doLast {
            def snapshot = [:]
            ['compileClasspath', 'runtimeClasspath', 'testCompileClasspath', 'testRuntimeClasspath'].each { name ->
                def configuration = rootProject.configurations.getByName(name)
                // Strict resolution fails on missing dependencies instead of comparing partial graphs.
                def artifacts = configuration.resolvedConfiguration.resolvedArtifacts.collect {
                    it.moduleVersion.id.toString()
                }.unique().sort()
                def components = configuration.incoming.resolutionResult.allComponents.findAll {
                    it.id instanceof ModuleComponentIdentifier
                }.collect { it.moduleVersion.toString() }.unique().sort()
                snapshot[name] = [artifacts: artifacts, components: components]
            }
            def output = new File(System.getProperty('dependencySnapshot.output'))
            output.parentFile.mkdirs()
            output.text = JsonOutput.prettyPrint(JsonOutput.toJson(snapshot)) + '\n'
        }
    }
}
